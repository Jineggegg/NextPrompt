[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-prompty"
version = "0.1.2"
description = "NextPrompt for Codex: lightweight next-step suggestions"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
nextprompt = "nextprompt.cli:main"

[tool.setuptools]
packages = ["nextprompt"]

[tool.setuptools.package-data]
nextprompt = ["instruction.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real Codex CLI with a local simulated model service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
