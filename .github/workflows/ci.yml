name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests (linux, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.12']
    # Every job runs on the self-hosted Linux runner on AJ's machine (no Actions
    # minutes). Windows and macOS hosted runners are off; their installer tests
    # skip on Linux, so check those platforms locally before a release.
    runs-on: [self-hosted, linux, nextprompt]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
