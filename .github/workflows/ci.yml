name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests (linux, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    # GitHub-hosted runner: in a public repo, fork PRs must never run on a
    # self-hosted machine. Windows and macOS are tested by hand; see CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
